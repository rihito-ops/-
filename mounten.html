        <div class = "spot">
           <h2>五色台</h2>

    <img src="img/goshikidai.jpg" alt="五色台">

    <p>
        五色台は瀬戸内海を一望できる景勝地です。
        ドライブやハイキングを楽しめ、夕日の景色も人気があります。
    </p>
</div>

<div class="spot">
    <h2>紫雲出山</h2>

    <img src="img/shiude.jpg" alt="紫雲出山">

    <p>
        春には桜と瀬戸内海を同時に楽しめる絶景スポットです。
        展望台からの景色は香川県を代表する観光名所です。
    </p>
</div>

<div class="spot">
    <h2>飯野山（讃岐富士）</h2>

    <img src="img/iinoyama.jpg" alt="飯野山">

    <p>
        美しい円すい形の山で「讃岐富士」と呼ばれています。
        初心者でも登山しやすく、多くの観光客が訪れます。
    </p>

        </div>
