<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>旅行プラン作成システム</title>
        <link rel="stylesheet" href="tour.css">
    </head>
    <body>
        <h1>旅行プラン作成システム</h1>
        <nav>
            <p><a href="top.html">トップ</a>&nbsp;/&nbsp;おすすめ旅行先</p>
        </nav>

        <p>香川県旅行プラン作成システムへようこそ！<br>
        このサイトでは食べ物や景色など香川県の魅力を感じてもらうべく、おすすめの場所をまとめました。<br>
        是非、これを機に香川県を楽しんでいただければ幸いです。</p>

        <label for="place">調べたい食べ物や観光地を選択してください：</label>
        <select id="place">
            <option value="" selected disabled>食べ物・観光地</option>
            <option value="udon.html">うどん</option>
            <option value="udonjanaiyo.html">うどん以外</option>
            <option value="mounten.html">山</option>
            <option value="sea.html">海</option>
        </select>
        <button onclick="movePlace()">決定</button>
        <script>            
            function movePlace() {
                const place = document.getElementById("place").value;

                if (place !== "") {
                    window.location.href = place;
                } else {
                alert("サイトを選択してください。");
                }
            }
        </script>
    </body>
</html>
